intents:
  - tag: greetings
    patterns:
      - "Hello"
      - "Hi"
      - "Hey"
      - "Good morning"
      - "Good evening"
      - "Hey there"
      - "Hi assistant"
    responses:
      - "Hi there!"
      - "Hello, how can I help you today?"
      - "Welcome back! What can I do for you?"

  - tag: weather
    patterns:
      - "What's the weather like?"
      - "Tell me the weather"
      - "Is it raining?"
      - "Do I need an umbrella?"
      - "How hot is it today?"
      - "Is it cold outside?"
    responses:
      - "Sure, checking the weather for you."
    action: weather

  - tag: music
    patterns:
      - "Play some music"
      - "Start a song"
      - "Play my playlist"
      - "Play music now"
      - "I want to listen to something"
      - "Play a song please"
    responses:
      - "Okay, starting music."
    action: play_music

  - tag: youtube
    patterns:
      - "Open YouTube"
      - "Play a video"
      - "Start YouTube"
      - "Show me videos"
    responses:
      - "Opening YouTube for you."
    action: open_youtube

  - tag: google
    patterns:
      - "Open Google"
      - "Search something"
      - "I want to Google"
      - "Start Google"
    responses:
      - "Okay, opening Google."
    action: open_google

  - tag: time
    patterns:
      - "What time is it?"
      - "Tell me the time"
      - "Current time please"
      - "Check the time"
      - "time now"
    responses:
      - "Let me check the time for you."
    action: get_time

  - tag: shutdown
    patterns:
      - "Shut down"
      - "Close the assistant"
      - "Exit program"
      - "Turn off"
    responses:
      - "Shutting down. Goodbye!"
    action: shutdown

  - tag: joke
    patterns:
      - "Tell me a joke"
      - "Make me laugh"
      - "Say something funny"
    responses:
      - "Why don't scientists trust atoms? Because they make up everything!"
      - "I'm reading a book on anti-gravity. It's impossible to put down!"

  - tag: reminder
    patterns:
      - "Remind me to take medicine"
      - "Set a reminder for class"
      - "Can you set a reminder?"
    responses:
      - "Okay, reminder set (hypothetically). This assistant doesn't store reminders yet."
      - "Got it. Just imagine I set that reminder."

  - tag: facts
    patterns:
      - "Tell me a fact"
      - "Share something interesting"
      - "Do you know any facts?"
    responses:
      - "Did you know? Honey never spoils."
      - "Octopuses have three hearts!"

  - tag: unknown
    patterns:
      - "What is the meaning of life?"
      - "How do black holes work?"
      - "Can AI feel emotions?"
      - "How does quantum computing work?"
    responses:
      - "That's an interesting question. Let me think..."
    action: call_gemini
